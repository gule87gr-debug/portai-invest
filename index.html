<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>document.documentElement.className=localStorage.getItem('portai-theme')||'dark'</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <title>PortAI — AI Bias Checker & Portfolio Tracker</title>

    <meta name="description" content="Track stocks, ETFs and crypto with AI-powered bias detection on financial news. Real-time portfolio tracking and trust scores for retail investors." />
    <meta name="keywords" content="AI financial news bias checker, AI portfolio tracker, financial news trust score, detect market manipulation, AI fact-checking for stocks, bias detection report, real-time S&P 500 heatmap, multi-asset watchlist, stock price alerts, crypto portfolio tracker, AI market sentiment analysis, retail investor tools, AI stock analysis, large language model finance, objective financial news" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="PortAI" />
    <meta name="theme-color" content="#05080F" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
    <meta name="google-site-verification" content="KOZFDTmpT5yNvxDZLcrQvnA3RthmGR2o1PpC0HO411Y" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload critical font CSS so the browser fetches it ASAP -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Lora:wght@600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Lora:wght@600;700&display=swap"
    />

    <!-- Preload the actual woff2 files for instant first paint -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/plusjakartasans/v8/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_qU79TguTFw.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/lora/v35/0QI6MX1D_JOuGQbT0gvTJPa787weuxJBkqg.woff2"
      crossorigin
    />

    <!-- Fallback fonts tuned with size-adjust to closely match Lora & Plus Jakarta Sans, eliminating CLS -->
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans Fallback";
        src: local("Segoe UI"), local("Helvetica Neue"), local("Arial");
        size-adjust: 100%;
        ascent-override: 95%;
        descent-override: 28%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Lora Fallback";
        src: local("Georgia"), local("Times New Roman"), local("Times");
        size-adjust: 105%;
        ascent-override: 92%;
        descent-override: 24%;
        line-gap-override: 0%;
      }
    </style>

    <!-- Open Graph -->
    <meta property="og:title" content="PortAI | AI Financial News Bias Checker & Professional Portfolio Tracker" />
    <meta property="og:description" content="Analyze financial news for bias, track 550+ stocks with live heatmaps, and get AI-powered market sentiment analysis — all in one tool for retail investors." />
    <meta property="og:url" content="https://portai-invest.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PortAI" />
    <meta property="og:image" content="https://portai-invest.com/og-image.jpg" />
    <meta property="og:image:width" content="1170" />
    <meta property="og:image:height" content="1464" />
    <meta property="og:image:alt" content="PortAI AI Stock Bias Analysis Dashboard" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PortAI | AI Financial News Bias Checker & Professional Portfolio Tracker" />
    <meta name="twitter:description" content="Analyze financial news for bias, track 550+ stocks with live heatmaps, and get AI market sentiment analysis." />
    <meta name="twitter:image" content="https://portai-invest.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="PortAI AI Stock Bias Analysis Dashboard" />
  </head>
